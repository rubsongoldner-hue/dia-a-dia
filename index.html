<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dia a Dia">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dia a Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: uma coluna de app de bolso (máx. 560px), cabeçalho com data grande, lista no meio, barra de abas fixa embaixo. */
:root {
  --bg: #F2F4F0;
  --surface: #FFFFFF;
  --surface-2: #E9EEE9;
  --ink: #15201A;
  --muted: #6A766F;
  --line: #DCE3DD;
  --accent: #1E5A44;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEBE3;
  --wine: #8C1D35;
  --wine-soft: #F4E1E5;
  --ochre: #9A6A12;
  --slate: #3C5A78;
  --shadow: 0 1px 2px rgba(20,40,30,.06), 0 8px 24px rgba(20,40,30,.06);
  --scrim: rgba(10,18,14,.38);
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-display: var(--f-body);
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1311; --surface: #161D1A; --surface-2: #1D2622; --ink: #E7EDE9; --muted: #8B9991;
    --line: #25302B; --accent: #5DB38D; --accent-ink: #0B1712; --accent-soft: #1B2D25;
    --wine: #E4718A; --wine-soft: #33191F; --ochre: #D9A548; --slate: #86A8CB;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #161D1A; --surface-2: #1D2622; --ink: #E7EDE9; --muted: #8B9991;
  --line: #25302B; --accent: #5DB38D; --accent-ink: #0B1712; --accent-soft: #1B2D25;
  --wine: #E4718A; --wine-soft: #33191F; --ochre: #D9A548; --slate: #86A8CB;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; font-size: 16px; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }

#app { max-width: 560px; margin: 0 auto; padding-block: 18px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Cabeçalho do dia ---------- */
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-block: 8px 14px; }
.dayhead > div:first-child { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow .rel { color: var(--accent); }
h1.date { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.05; margin: 6px 0 0; letter-spacing: -.025em; text-wrap: balance; }
h1.date em { font-style: normal; font-weight: 500; color: var(--muted); }
.back-today { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 4px 10px; text-transform: none; }

.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring svg { width: 62px; height: 62px; transform: rotate(-90deg); }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--accent); transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.ring.full .val { stroke: var(--accent); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ring b small { font-weight: 500; color: var(--muted); }

/* ---------- Faixa da semana ---------- */
.week { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
.wk-nav { width: 30px; height: 52px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; flex: none; }
.wk-nav svg { width: 16px; height: 16px; }
.wk-days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; min-width: 0; }
.wd-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 8px; border-radius: 14px; }
.wd-btn .wd { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.wd-btn .dn { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wd-btn .bar { width: 18px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.wd-btn .bar i { display: block; height: 100%; background: var(--accent); }
.wd-btn .bar.none { background: transparent; }
.wd-btn.today .dn { color: var(--accent); }
.wd-btn.sel { background: var(--ink); }
.wd-btn.sel .wd, .wd-btn.sel .dn { color: var(--bg); }
.wd-btn.sel .bar { background: color-mix(in srgb, var(--bg) 30%, transparent); }
.wd-btn.sel .bar i { background: var(--bg); }

/* ---------- Seções e itens ---------- */
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
ul.items { list-style: none; margin: 0; padding: 4px 0; }
.item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 52px; right: 14px; height: 1px; background: var(--line); }
.chk { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent); display: grid; place-items: center; margin-top: 1px; transition: background .2s, border-color .2s, transform .2s; }
.chk svg { width: 14px; height: 14px; stroke: var(--accent-ink); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
.item.is-done .chk, .item.checking .chk { background: var(--accent); border-color: var(--accent); }
.item.is-done .chk svg, .item.checking .chk svg { opacity: 1; transform: scale(1); }
.item.checking .chk { transform: scale(1.12); }
.txt { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 3px 0; }
.txt .t { font-size: 16px; overflow-wrap: anywhere; transition: color .25s; }
.item.is-done .t, .item.checking .t { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent); }
.item.is-moved .t { color: var(--muted); }
.item.is-moved .chk { border-style: dashed; opacity: .6; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 2px 7px; }
.tag svg { width: 11px; height: 11px; }
.tag-r { color: var(--accent); background: var(--accent-soft); }
.tag-c { color: var(--wine); background: var(--wine-soft); }

.add { display: flex; align-items: center; gap: 12px; padding: 8px 14px 10px; border-top: 1px solid var(--line); }
.add .plus { width: 26px; height: 26px; display: grid; place-items: center; color: var(--accent); flex: none; }
.add .plus svg { width: 18px; height: 18px; }
.add input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 0; outline: none; }
.add input::placeholder { color: var(--muted); }

.done-toggle { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--muted); font-size: 14px; font-weight: 500; }
.done-toggle svg { width: 14px; height: 14px; transition: transform .2s; }
.done-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.done-wrap { border-top: 1px solid var(--line); }

.empty { padding: 26px 18px 18px; text-align: center; color: var(--muted); }
.empty p { margin: 0; }
.empty .big { font-family: var(--f-display); font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }

.all-done { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
.all-done svg { width: 18px; height: 18px; }

/* ---------- Telas de rotina e listas ---------- */
.page-head { padding-block: 8px 6px; }
.page-head h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; letter-spacing: -.025em; line-height: 1.05; margin: 0; }
.page-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 46ch; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; border-radius: 12px; padding: 10px 14px; background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--wine); background: var(--wine-soft); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }

.r-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.r-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; width: 100%; }
.r-card.off { opacity: .55; }
.r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.r-title { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.dots { display: flex; gap: 4px; }
.dots span { width: 26px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-2); }
.dots span.on { background: var(--accent); color: var(--accent-ink); }
.streak { text-align: right; flex: none; }
.streak b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.streak small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }

.l-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; }
.l-card { text-align: left; padding: 16px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--lc, var(--accent)); width: 100%; }
.l-card h3 { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.l-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.l-card li { font-size: 14.5px; display: flex; gap: 8px; align-items: baseline; }
.l-card li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; transform: translateY(1px); }
.l-card .foot { font-size: 13px; color: var(--muted); }
.lc-green { --lc: var(--accent); } .lc-wine { --lc: var(--wine); } .lc-ochre { --lc: var(--ochre); } .lc-slate { --lc: var(--slate); }

.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; font-size: 15px; padding: 6px 0; }
.back svg { width: 18px; height: 18px; }
.list-title { display: flex; align-items: center; gap: 10px; }
.list-title i { width: 12px; height: 12px; border-radius: 50%; background: var(--lc); flex: none; }

/* ---------- Histórico ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding: 14px 14px 4px; }
.cal-head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: -.015em; text-transform: capitalize; }
.cal-head h2 em { font-style: normal; font-weight: 500; color: var(--muted); }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); }
.cal-nav svg { width: 16px; height: 16px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 10px 14px 16px; }
.cal .h { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 4px; }
.cal button { aspect-ratio: 1; max-width: 100%; border-radius: 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); position: relative; }
.cal button.fut { background: transparent; color: var(--muted); font-weight: 500; }
.cal button.dark { color: var(--accent-ink); }
.cal button.today { box-shadow: inset 0 0 0 2px var(--ink); }
.legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: 11.5px; color: var(--muted); padding: 0 14px 14px; }
.legend span { width: 14px; height: 14px; border-radius: 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stat { padding: 14px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.3; }

.settings { margin-top: 10px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .lbl { min-width: 0; }
.set-row .lbl b { display: block; font-weight: 600; font-size: 15.5px; }
.set-row .lbl small { color: var(--muted); font-size: 13px; }
.switch { width: 50px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 16px; }
.note { font-size: 13px; color: var(--muted); padding: 0 16px 14px; margin: 0; }

/* ---------- Barra de abas ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(18px); -webkit-backdrop-filter: saturate(1.4) blur(18px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tab-h); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* ---------- Folha inferior ---------- */
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); animation: up .28s cubic-bezier(.2,.9,.25,1); }
.sheet-in { max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 14px; }
.sheet-in h3 { margin: 0 0 14px; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
.field { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; outline: none; }
.field:focus { border-color: var(--accent); }
.f-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daypick button { height: 42px; border-radius: 11px; background: var(--surface-2); font-weight: 600; font-size: 13px; }
.daypick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.presets button { font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 6px 12px; }
.colors { display: flex; gap: 10px; }
.colors button { width: 36px; height: 36px; border-radius: 50%; background: var(--lc); }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--lc); }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.sheet-actions .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet-note { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }
.sheet-note button { color: var(--accent); font-weight: 600; }
.haptic { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.set-btn { width: 100%; text-align: left; }
.set-btn .chev { color: var(--muted); flex: none; } .set-btn .chev svg { width: 16px; height: 16px; }
.tab.warn::after { content: ""; position: absolute; margin: -22px 0 0 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--wine); }
.tab { position: relative; }

/* ---------- Efeitos de toque ---------- */
button, .item { transition: transform .14s ease, background-color .18s ease, opacity .18s ease; }
.btn:active, .wd-btn:active, .wk-nav:active, .cal button:active, .cal-nav button:active, .presets button:active, .daypick button:active, .seg button:active, .back:active, .back-today:active, .colors button:active { transform: scale(.94); }
.btn:active { filter: brightness(.94); }
.card.r-card:active, .card.l-card:active, .set-btn:active { transform: scale(.98); background-color: var(--surface-2); }
.txt:active { opacity: .55; }
.item:has(.txt:active) { background-color: color-mix(in srgb, var(--accent) 7%, transparent); }
.chk:active { transform: scale(.86); }
.tab:active svg { transform: scale(.84); }
.tab svg { transition: transform .16s ease; }
.tab[aria-selected="true"] svg { animation: tabpop .32s cubic-bezier(.3,1.6,.5,1); }
@keyframes tabpop { 40% { transform: scale(1.18); } }
.switch:active::after { width: 30px; }
.switch[aria-checked="true"]:active::after { transform: translateX(14px); }
.done-toggle:active { opacity: .6; }
.chk { position: relative; }
.chk::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.item.checking .chk::after { animation: burst .5s ease-out; }
@keyframes burst { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
.item.unchecking .chk { transform: scale(.9); }
.item.leaving { overflow: hidden; opacity: 0; padding-block: 0; transition: height .24s ease, opacity .2s ease, padding .24s ease; }
.lay-cards .item.leaving { margin-top: -8px; }
.item.entering { animation: enter .3s cubic-bezier(.2,.9,.3,1.2); }
@keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.add .mic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); flex: none; }
.add .mic svg { width: 18px; height: 18px; }
.add .mic:active { transform: scale(.88); }
.mic-big { width: 84px; height: 84px; border-radius: 50%; margin: 10px auto 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.mic-big svg { width: 34px; height: 34px; }
.mic-big:active { transform: scale(.93); }
.mic-big.on { background: var(--wine); color: #fff; animation: micpulse 1.4s ease-out infinite; }
@keyframes micpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--wine) 45%, transparent); } 100% { box-shadow: 0 0 0 22px transparent; } }
.mic-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 14px; }
textarea.field.voice-txt { font-family: var(--f-body); font-size: 16px; min-height: 92px; }

  for (const k in s.days || {}) for (const i of s.days[k].items) m.set('I' + i.id, i);
  for (const x of s.plans || []) m.set('P' + x.id, x);
  for (const x of s.sessions || []) m.set('W' + x.id, x);
  for (const x of s.shop || []) m.set('M' + x.id, x);

    const map = new Map(), order = [];

      const x = map.get(y.id);

      map.set(y.id, join ? join(x, y) : ((y.u || 0) > (x.u || 0) ? y : x));

  out.lists = arr(a.lists, b.lists, 'L', (x, y) => ({ ...((y.u || 0) > (x.u || 0) ? y : x), items: items(x.items, y.items) }))
    .map(l => ({ ...l, items: l.items.filter(i => alive('I' + i.id, i)) }));

  for (const k of new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})])) {

    d.items = d.items.filter(i => alive('I' + i.id, i));

  if ((b.settingsU || 0) > (a.settingsU || 0)) { out.settings = { ...b.settings }; out.settingsU = b.settingsU; }

  out.sessions = arr(a.sessions, b.sessions, 'W');
  out.shop = arr(a.shop, b.shop, 'M');
  out.dlog = { ...(b.dlog || {}) };
  for (const k in a.dlog || {}) { const x = a.dlog[k], y = out.dlog[k]; if (!y || (x.u || 0) >= (y.u || 0)) out.dlog[k] = x; }
  if (b.diet && (!a.diet || (b.diet.u || 0) > (a.diet.u || 0))) out.diet = b.diet;
  return out;
}

const CAL_BACK = 7, CAL_AHEAD = 30;
async function syncCal() {
  const t = today(), from = addDays(t, -CAL_BACK), to = addDays(t, CAL_AHEAD + 1);
  const r = await api('GET', null, `&cal=1&from=${parse(from).getTime()}&to=${parse(to).getTime()}`);
  if (!Array.isArray(r.events)) { cfg.calErr = 'script'; saveCfg(); return; }
  delete cfg.calErr; saveCfg();

}
// Insere, atualiza e remove (se apagados na Agenda) os compromissos entre "from" e "to".
function applyEvents(evs, from, to) {
  const want = new Map();
  for (const ev of evs) {
    const d = new Date(ev.s), k = key(d);
    if (k < from || k >= to) continue;
    want.set(`cal-${ev.id}-${k}`, { k, t: ev.t || '(sem título)', time: ev.all ? '' : `${pad(d.getHours())}:${pad(d.getMinutes())}` });
  }
  const before = JSON.stringify(S.days);
  for (let k = from; k < to; k = addDays(k, 1)) {
    const d = S.days[k]; if (d) d.items = d.items.filter(i => !i.cal || i.done || want.has(i.id));
  }
  for (const [id, ev] of want) {
    if (S.del['I' + id]) continue;
    const rec = dayRec(ev.k), ex = rec.items.find(i => i.id === id);
    if (ex) { ex.t = ev.t; ex.time = ev.time; }
    else rec.items.push({ id, t: ev.t, done: false, cal: 1, time: ev.time });
  }
  for (const k of new Set([...want.values()].map(v => v.k))) {
    const d = S.days[k];
    const cal = d.items.filter(i => i.cal).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    d.items = [...cal, ...d.items.filter(i => !i.cal)];

// Tarefas com aviso nos próximos 60 dias (as da Agenda já têm aviso por lá).
function reminderList() {
  const t = today(), end = addDays(t, 60), out = [], dues = new Set();
  const due = i => {
    if (!i.due || i.done || i.moved || i.due < t || i.due > end || dues.has(i.id)) return;
    dues.add(i.id);
    const d = parse(i.due); d.setHours(9, 0, 0, 0);
    out.push({ id: i.id + '#prazo', t: 'Prazo: ' + i.t, s: d.getTime(), alert: 1440, notes: i.notes || '' });
  };
  for (const l of S.lists) l.items.forEach(due);
  for (const k in S.days) S.days[k].items.forEach(due);
  for (const k in S.days) {
    if (k < t || k > end) continue;
    for (const i of S.days[k].items) {
      if (i.done || i.moved || i.cal || !i.time || i.alert == null) continue;
      const [h, m] = i.time.split(':').map(Number), d = parse(k); d.setHours(h, m, 0, 0);

    settings: { carry: true }, ui: {}, lastRoll: t,

const dayRec = k => (S.days[k] ||= { items: [], rs: [], skip: [] });
const matches = (r, k) => r.on && r.days.includes(parse(k).getDay());
function ensure(k) {
  if (k < today()) return false;
  let changed = false;
  for (const r of S.routines) {
    if (!matches(r, k)) continue;
    const d = S.days[k];
    if (d && (d.rs.includes(r.id) || d.skip.includes(r.id))) continue;
    const rec = dayRec(k);
    const tm = r.times?.[parse(k).getDay()];
    rec.items.unshift({ id: `r-${r.id}-${k}`, t: r.t, done: false, r: r.id, ...(tm ? { time: tm } : {}), ...(tm && r.alert != null ? { alert: r.alert } : {}) });
    rec.rs.push(r.id); changed = true;
  }
  return changed;
}
// Atualiza dias de hoje em diante depois que uma rotina muda.
function resync(r, removed) {
  const t = today();
  for (const k in S.days) {
    if (k < t) continue;
    const d = S.days[k];
    const keep = !removed && matches(r, k);
    d.items = d.items.filter(i => {
      if (i.r !== r.id || i.done) return true;
      if (keep) {
        i.t = r.t;
        const tm = r.times?.[parse(k).getDay()];
        if (tm) i.time = tm; else delete i.time;
        if (tm && r.alert != null) i.alert = r.alert; else delete i.alert;
        return true;
      }
      return false;
    });
    if (!keep) d.rs = d.rs.filter(x => x !== r.id || d.items.some(i => i.r === r.id));
  }
}
// Leva tarefas avulsas não concluídas de dias anteriores para hoje.
function rollover() {
  const t = today();
  if (S.lastRoll === t) return 0;
  S.lastRoll = t;
  if (!S.settings.carry) return 0;
  const moved = [];
  const has = new Set((S.days[t]?.items || []).filter(i => !i.done).map(i => i.t));
  for (const k of Object.keys(S.days).sort()) {
    if (k >= t) continue;
    for (const i of S.days[k].items) {
      if (i.done || i.moved || i.r || i.cal) continue;
      i.moved = t;
      if (has.has(i.t)) continue;
      has.add(i.t);
      moved.push({ id: `${i.id}>${t}`, t: i.t, done: false, from: i.from || k, ...(i.notes ? { notes: i.notes } : {}), ...(i.due ? { due: i.due } : {}), ...(i.urgent ? { urgent: 1 } : {}) });
    }
  }
  if (moved.length) dayRec(t).items.unshift(...moved);
  return moved.length;
}
function dayStats(k) {
  const d = S.days[k]; if (!d) return null;
  const it = d.items.filter(i => !i.moved);
  if (!it.length) return null;
  const dn = it.filter(i => i.done).length;
  return { dn, tot: it.length, pct: dn / it.length };
}
function streak(r) {
  const t = today(); let n = 0;
  const has = k => { const d = S.days[k]; const i = d && d.items.find(x => x.r === r.id); return i && i.done; };
  if (r.days.includes(parse(t).getDay()) && has(t)) n++;
  let k = addDays(t, -1);
  for (let c = 0; c < 730; c++, k = addDays(k, -1)) {
    if (!r.days.includes(parse(k).getDay())) continue;
    if (has(k)) n++; else break;
  }
  return n;
}

// Acha uma tarefa pelo id: nas listas, no dia em vista ou em qualquer outro dia.
function locate(id) {
  for (const l of S.lists) { const i = l.items.find(x => x.id === id); if (i) return { i, arr: l.items, list: l, k: null }; }
  const keys = [viewDate, ...Object.keys(S.days).filter(k => k !== viewDate)];
  for (const k of keys) { const d = S.days[k]; const i = d && d.items.find(x => x.id === id); if (i) return { i, arr: d.items, list: null, k }; }
  return null;
}
const findItem = id => locate(id)?.i;
// Prazo final: quantos dias faltam e o nível de alerta.
function dueInfo(i) {
  if (!i.due) return null;
  const d = Math.round((parse(i.due) - parse(today())) / 864e5);
  const label = d < 0 ? `atrasada ${-d} dia${d === -1 ? '' : 's'}` : d === 0 ? 'vence hoje' : d === 1 ? 'vence amanhã' : d <= 7 ? `vence em ${d} dias` : `prazo ${fmtShort(i.due)}`;
  return { d, label, lvl: d <= 0 ? 'crit' : d <= 2 ? 'warn' : 'ok' };
}
// O que precisa de atenção: urgentes e prazos até 3 dias, de todos os dias e listas.
function attention() {
  const out = [], seen = new Set(), t = today();
  const add = (i, where) => {
    if (i.done || i.moved || seen.has(i.id)) return;
    const di = dueInfo(i);
    if (!i.urgent && !(di && di.d <= 3)) return;
    seen.add(i.id); out.push({ i, where, d: di ? di.d : 99 });
  };
  for (const l of S.lists) for (const i of l.items) add(i, l.name);
  for (const k of Object.keys(S.days).sort()) for (const i of S.days[k].items) add(i, k === t ? 'Hoje' : dayLabel(k));
  return out.sort((a, b) => a.d - b.d);
}

const activeSession = () => S.sessions.find(x => !x.end);

function lastSets(name, exceptId) {
  const n = norm(name);
  for (const s of S.sessions.filter(x => x.end && x.id !== exceptId).sort((a, b) => b.start - a.start)) {
    const e = s.ex.find(x => norm(x.n) === n); if (!e) continue;
    const ok = e.sets.filter(x => x.ok && (x.w !== '' || x.r !== ''));
    if (ok.length) return ok;
  }
  return null;
}
const volume = s => s.ex.reduce((a, e) => a + e.sets.filter(x => x.ok).reduce((b, x) => b + (+x.w || 0) * (+x.r || 0), 0), 0);
const setsDone = s => s.ex.reduce((a, e) => a + e.sets.filter(x => x.ok).length, 0);

    const l = last && (last[i] || last[last.length - 1]);
    return { w: l ? l.w : '', r: l ? l.r : (parseInt(reps) || ''), ok: false };
  });
}

const dlogRec = k => (S.dlog[k] ||= { water: 0, done: [], foods: [] });
// "2 ovos 150 kcal 12g prot" vira { t: "2 ovos", kcal: 150, p: 12 }
function parseFood(txt) {
  let t = txt, kcal = null, p = null;
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*kcal/i, (m, n) => { kcal = Math.round(+n.replace(',', '.')); return ' '; });
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*g?\s*(?:de\s+)?(?:prote[ií]nas?|prot|ptn)\b/i, (m, n) => { p = +n.replace(',', '.'); return ' '; });
  t = t.replace(/\s+/g, ' ').replace(/[,;·-]+\s*$/, '').trim() || txt.trim();
  return { t: t[0].toUpperCase() + t.slice(1), kcal, p };
}
function recentFoods(meal, k) {
  const out = [], seen = new Set();
  for (const d of Object.keys(S.dlog).sort().reverse()) {
    if (d === k) continue;
    for (const f of S.dlog[d].foods || []) if (f.meal === meal && !seen.has(norm(f.t))) { seen.add(norm(f.t)); out.push(f); }
    if (out.length >= 6) break;
  }
  return out;
}
function addFood(meal, txt, from) {
  const f = from ? { t: from.t, kcal: from.kcal ?? null, p: from.p ?? null } : parseFood(txt);
  const d = dlogRec(dietDate || today());
  d.foods.push({ id: uid(), meal, ...f });
  if (!d.done.includes(meal)) d.done.push(meal);
  save();
}

  const k = dietDate, d = S.dlog[k] || { water: 0, done: [], foods: [] }, g = S.diet.goals || {};

  const meals = S.diet.meals.map(m => {

      ${foods.length ? `<ul class="foods">${foods.map(f => `<li><span>${esc(f.t)}</span><span class="fmeta">${[f.kcal != null ? `${f.kcal} kcal` : '', f.p != null ? `${kg(f.p)} g prot` : ''].filter(Boolean).join(' · ')}</span>
        <button class="x-btn" data-act="food-del" data-id="${f.id}" aria-label="Remover ${esc(f.t)}">×</button></li>`).join('')}</ul>` : ''}
      <form class="add" data-scope="food:${m.id}" autocomplete="off"><span class="plus">${I.plus}</span>
        <input id="add-food-${m.id}" placeholder="Ex.: 2 ovos 150 kcal 12g prot" enterkeyhint="done" aria-label="O que comeu em ${esc(m.n)}"></form>
      ${rec.length ? `<div class="chips">${rec.map(f => `<button data-act="food-re" data-meal="${m.id}" data-t="${esc(f.t)}">${I.plus}${esc(f.t)}</button>`).join('')}</div>` : ''}
    </div>`;

  return `<div class="dnav"><button class="wk-nav" data-act="ddate" data-n="-1" aria-label="Dia anterior">${I.left}</button>

const CATS = [
  ['Hortifrúti', /\b(banana|maca|laranja|limao|tomate|alface|cebola|alho|batata|cenoura|fruta|verdura|legume|abacate|mamao|uva|morango|brocolis|abobrinha|abobora|pepino|couve|rucula|pimentao|melao|melancia|manga|abacaxi|kiwi|pera|espinafre|cheiro verde|salsinha|coentro|gengibre|mandioca|inhame|beterraba|repolho)/],
  ['Carnes e peixes', /\b(carne|frango|peixe|patinho|alcatra|picanha|linguica|bacon|presunto|peito de peru|salmao|tilapia|atum|sardinha|costela|file|acem|musculo|coxa|sobrecoxa|camarao|hamburguer|salsicha|mortadela|salame)/],
  ['Laticínios e ovos', /\b(leite|queijo|iogurte|manteiga|requeijao|creme de leite|nata|ovo|ovos|margarina|mussarela|parmesao|cottage|ricota|kefir)/],
  ['Padaria', /\b(pao|paes|bisnaguinha|bolo|torrada|biscoito|bolacha|croissant|rap10|tortilha|wrap)/],
  ['Limpeza', /\b(detergente|sabao|amaciante|desinfetante|agua sanitaria|esponja|papel toalha|saco de lixo|limpador|alvejante|multiuso|lustra|vassoura|pano de chao|lava roupa|lava loucas)/],
  ['Higiene', /\b(papel higienico|sabonete|shampoo|xampu|condicionador|pasta de dente|creme dental|escova de dente|desodorante|fio dental|absorvente|barbeador|lamina|hidratante|protetor solar|cotonete|algodao)/],
  ['Bebidas', /\b(agua|suco|refrigerante|cerveja|vinho|cha|energetico|isotonico|kombucha|agua de coco)/],
  ['Mercearia', /\b(arroz|feijao|macarrao|farinha|acucar|sal|oleo|azeite|cafe|aveia|granola|molho|tempero|milho|ervilha|lentilha|grao|chocolate|whey|pasta de amendoim|creatina|tapioca|cuscuz|mel|geleia|achocolatado|cereal|castanha|amendoim|biscoito de arroz|vinagre|ketchup|maionese|mostarda)/],
];
const SHOP_CATS = [...CATS.map(c => c[0]), 'Outros'];
const catOf = t => { const n = norm(t); for (const [c, re] of CATS) if (re.test(n)) return c; return 'Outros'; };
// "2 kg arroz", "arroz 2kg" ou "6 bananas" separam a quantidade do nome.
function parseShop(txt) {
  let t = txt.trim(), qty = '';
  const unit = '(?:kg|g|l|ml|un|unid(?:ades?)?|pct|pacotes?|cx|caixas?|dz|d[uú]zias?|latas?|garrafas?|potes?|bandejas?|maços?|ma[cç]os?)';
  let m = t.match(new RegExp(`^(\\d+(?:[.,]\\d+)?\\s*${unit}?)\\s+(?:de\\s+)?(.+)$`, 'i'));
  if (m) { qty = m[1]; t = m[2]; }
  else if ((m = t.match(new RegExp(`^(.+?)\\s+(\\d+(?:[.,]\\d+)?\\s*${unit}?)$`, 'i')))) { t = m[1]; qty = m[2]; }
  return { t: t[0].toUpperCase() + t.slice(1), qty: qty.replace(/\s+/g, ' ') };
}
function addShop(txt) {
  let n = 0;
  for (const part of txt.split(/[,;\n]+/)) {
    if (!part.trim()) continue;
    const { t, qty } = parseShop(part);
    const ex = S.shop.find(i => norm(i.t) === norm(t));
    if (ex) { ex.arch = false; ex.done = false; if (qty) ex.qty = qty; }
    else S.shop.push({ id: uid(), t, qty, cat: catOf(t), done: false, arch: false, n: 0 });
    n++;
  }
  if (n) save();
  return n;
}
function shopRow(i) {
  return `<li class="item shop-i${i.done ? ' is-done' : ''}" data-id="${i.id}">
    <button class="chk" data-act="shop-ok" data-id="${i.id}" aria-label="${i.done ? 'Tirar do carrinho' : 'Pôr no carrinho'}: ${esc(i.t)}">${I.check}</button>
    <button class="txt" data-act="shop-edit" data-id="${i.id}"><span class="t">${esc(i.t)}</span>${i.qty ? `<span class="snip">${esc(i.qty)}</span>` : ''}</button></li>`;
}

  const live = S.shop.filter(i => !i.arch), pend = live.filter(i => !i.done), cart = live.filter(i => i.done);
  const groups = SHOP_CATS.map(c => [c, pend.filter(i => (i.cat || 'Outros') === c)]).filter(g => g[1].length);
  const freq = S.shop.filter(i => i.arch).sort((a, b) => (b.n || 0) - (a.n || 0)).slice(0, 14);
  return `<form class="card add shop-add" data-scope="shop" autocomplete="off"><span class="plus">${I.plus}</span>

    <div class="sec-head"><div><h2>Lista</h2><p>${pend.length ? `${pend.length} ite${pend.length === 1 ? 'm' : 'ns'} para comprar` : 'Nada para comprar.'}</p></div>

      : '<div class="card empty"><p class="big">Lista vazia</p><p>Escreva ou dite os itens acima. Eles se organizam por seção do mercado.</p></div>'}
    ${cart.length ? `<div class="sec-head"><div><h2>No carrinho</h2><p>${cart.length} ite${cart.length === 1 ? 'm' : 'ns'}</p></div></div>
      <div class="card shop-card"><ul class="items">${cart.map(shopRow).join('')}</ul></div>
      <div class="sheet-actions"><button class="btn primary block" data-act="finish-shop">Finalizar compra</button></div>` : ''}`;
}

const pessoalActions = {
  ptab(b) { S.ui.pTab = b.dataset.v; write(); render(true); },
  // treino
  'new-plan'() { planSheet(null); },
  'edit-plan'(b) { const p = S.plans.find(x => x.id === b.dataset.id); if (p) planSheet(p); },
  'pex-add'() { planEx.push({ n: '', s: 3, r: '10' }); renderPex(); const ins = document.querySelectorAll('.pex-n'); ins[ins.length - 1]?.focus(); },
  'pex-del'(b) { planEx.splice(+b.dataset.i, 1); renderPex(); },
  'save-plan'() {
    const name = $('#f-title').value.trim(); if (!name) { $('#f-title').focus(); return; }
    const ex = planEx.filter(e => e.n && e.n.trim()).map(e => ({ n: e.n.trim(), s: Math.max(1, parseInt(e.s) || 3), r: String(e.r || '10').trim() }));
    let p = S.plans.find(x => x.id === sheetCtx.id);
    if (!p) { p = { id: uid(), name, ex }; S.plans.push(p); } else { p.name = name; p.ex = ex; }
    save(); closeSheet(); render(); toast('Ficha salva');
  },
  'del-plan'(b) {
    if (!confirmTap(b, 'del-plan')) return;
    snap(); S.plans = S.plans.filter(x => x.id !== sheetCtx.id); save(); closeSheet(); render(); toast('Ficha excluída', true);
  },
  'start-plan'(b) { startSession(S.plans.find(x => x.id === b.dataset.id)); },
  'start-free'() { startSession(null); },
  'set-ok'(b) {
    const s = activeSession(); if (!s) return;
    const x = s.ex[+b.dataset.ei].sets[+b.dataset.si];
    const row = b.closest('.set');
    row.querySelectorAll('.sin').forEach(inp => { x[inp.dataset.f] = inp.value.replace(',', '.').trim(); });
    x.ok = !x.ok; haptic();
    if (x.ok) restEnd = Date.now() + (S.settings.rest || 90) * 1000;
    save(); render();
  },
  'set-add'(b) {
    const s = activeSession(); if (!s) return;
    const sets = s.ex[+b.dataset.ei].sets, l = sets[sets.length - 1];
    sets.push({ w: l ? l.w : '', r: l ? l.r : '', ok: false }); save(); render();
  },
  'ex-del'(b) {
    const s = activeSession(); if (!s) return;
    snap(); const [e] = s.ex.splice(+b.dataset.ei, 1); save(); render(); toast(`${e.n} removido`, true);
  },
  'rest-skip'() { restEnd = 0; const r = $('#rest-slot'); if (r) r.innerHTML = ''; },
  'finish-session'() {

// ---------- ditado por voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, voiceTasks = [];
const dayOv = {};
const WDN = { domingo: 0, segunda: 1, 'terça': 2, terca: 2, quarta: 3, quinta: 4, sexta: 5, 'sábado': 6, sabado: 6 };
// Separa o texto falado em tarefas. Pausas, pontuação e palavras como "depois" viram quebras.
function parseTasks(text, defK) {
  const t = text
    .replace(/(^|\s)(e depois disso|depois disso|e depois(?! de amanh)|depois(?! de amanh)|e em seguida|em seguida|e também|também|tambem|próxima tarefa|proxima tarefa|outra tarefa|próximo item|proximo item|outra coisa|além disso|alem disso)(?=\s|$|[,.;!?])/gi, '\n')
    .replace(/\s+e\s+(?=(?:para |pra |na |no )?(?:hoje|amanhã|amanha|depois de amanh|domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)(?:\s|$|-))/gi, '\n');
  const out = [];
  let cur = defK;
  for (let p of t.split(/[\n;.!?,]+/)) {
    p = p.replace(/\s+/g, ' ').trim();
    if (!p) continue;
    let k = null;
    const dm = p.match(/(^|\s)(?:para |pra |na |no |de |até |ate )?(depois de amanhã|depois de amanha|hoje|amanhã|amanha|(?:domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)(?:-feira| feira)?)(?=\s|$)/i);
    if (dm && defK) {
      const w = dm[2].toLowerCase(), t0 = today();
      if (w.startsWith('hoje')) k = t0;
      else if (w.startsWith('depois')) k = addDays(t0, 2);
      else if (w.startsWith('amanh')) k = addDays(t0, 1);
      else { const wd = WDN[w.split(/[- ]/)[0]]; for (let n = 1; n <= 7; n++) { const c = addDays(t0, n); if (parse(c).getDay() === wd) { k = c; break; } } }
      p = (p.slice(0, dm.index) + ' ' + p.slice(dm.index + dm[0].length)).replace(/\s+/g, ' ').trim();
    }
    p = p.replace(/^(e|eu|então|entao|ok|bom|tá|ta)\s+/i, '')
      .replace(/^(eu )?(não posso esquecer de|nao posso esquecer de|não esquecer de|nao esquecer de|lembrar de|tenho que|preciso de|preciso)\s+/i, '')
      .replace(/\s+(e|de|para|pra)$/i, '').trim();
    if (!p) { if (k) cur = k; continue; }
    if (p.length < 2) continue;
    out.push({ t: p[0].toUpperCase() + p.slice(1), k: defK ? (k || cur) : null });
  }
  return out;
}

}

// Lê os .json de um .zip (exportação do Takeout) sem biblioteca externa.
async function unzipJson(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder(), out = [];
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('zip');
  let off = dv.getUint32(e + 16, true);
  for (let n = dv.getUint16(e + 10, true); n > 0 && dv.getUint32(off, true) === 0x02014b50; n--) {
    const method = dv.getUint16(off + 10, true), size = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true), xlen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nlen));
    off += 46 + nlen + xlen + clen;
    if (!/\.json$/i.test(name)) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const data = u8.subarray(start, start + size);
    let bytes = data;
    if (method === 8) bytes = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if (method !== 0) continue;
    out.push(dec.decode(bytes));
  }
  return out;
}
const KEEP_COLOR = { RED: 'wine', PINK: 'wine', GREEN: 'green', TEAL: 'green', YELLOW: 'ochre', ORANGE: 'ochre', BROWN: 'ochre', BLUE: 'slate', DARK_BLUE: 'slate', CERULEAN: 'slate', PURPLE: 'slate', GRAY: 'slate' };
async function importKeep(files) {
  const texts = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name) || /zip/.test(f.type)) texts.push(...await unzipJson(await f.arrayBuffer()));
    else texts.push(await f.text());
  }
  const notes = texts.map(t => { try { return JSON.parse(t); } catch (e) { return null; } })
    .filter(n => n && typeof n === 'object' && ('listContent' in n || 'textContent' in n) && !n.isTrashed);
  if (!notes.length) { toast('Nenhuma nota do Keep encontrada nesse arquivo.'); return; }
  snap();
  let days = 0, lists = 0, items = 0, skipped = 0;
  for (const n of notes) {
    const lc = Array.isArray(n.listContent) ? n.listContent.filter(x => x && x.text && x.text.trim()) : [];
    if (!lc.length) { skipped++; continue; }
    const title = (n.title || '').trim();
    const m = title.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})$/);
    let target;
    if (m) {
      const y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      target = dayRec(`${y}-${pad(+m[2])}-${pad(+m[1])}`).items; days++;
    } else {
      const name = title || 'Sem título';
      let l = S.lists.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (!l) { l = { id: uid(), name, color: KEEP_COLOR[n.color] || 'green', items: [] }; S.lists.push(l); }
      target = l.items; lists++;
    }
    for (const x of lc) {
      const t = x.text.trim(), ex = target.find(i => i.t === t);
      if (ex) { if (x.isChecked) ex.done = true; continue; }
      target.push({ id: uid(), t, done: !!x.isChecked }); items++;
    }
  }
  save(); render();
  const t = today();
  let pend = 0;
  for (const k in S.days) if (k < t) pend += S.days[k].items.filter(i => !i.done && !i.moved && !i.r).length;
  openSheet(`<h3>Keep importado</h3>
    <p class="sheet-note" style="margin-top:0">${days} dia${days === 1 ? '' : 's'}, ${lists} lista${lists === 1 ? '' : 's'} e ${items} tarefa${items === 1 ? '' : 's'} trazidos.${skipped ? ` ${skipped} nota${skipped === 1 ? ' sem checklist ficou' : 's sem checklist ficaram'} de fora.` : ''}</p>
    ${pend ? `<p class="sheet-note">${pend} tarefa${pend === 1 ? '' : 's'} de dias anteriores ainda est${pend === 1 ? 'á' : 'ão'} pendente${pend === 1 ? '' : 's'}.</p>` : ''}
    <div class="sheet-actions">
      ${pend ? `<button class="btn primary block" data-act="carry-now">Trazer ${pend} pendência${pend === 1 ? '' : 's'} para hoje</button>` : ''}
      <button class="btn block" data-act="close-sheet">${pend ? 'Deixar nos dias de origem' : 'Pronto'}</button>
    </div>`, { kind: 'keep-done' });
}

function importText(txt) {
  try {
    const o = JSON.parse(txt);
    const data = o.dados || o.data || o;
    if (!data || typeof data !== 'object' || !data.days) throw 0;
    snap(); S = normalize(data); save(); closeSheet(); viewDate = today(); applyLayout(); render();
    toast('Backup importado', true);
  } catch (e) { toast('Arquivo não reconhecido. Use um backup do Dia a Dia.'); }
}

  const f = e.target; if (!f.classList.contains('add')) return;
  e.preventDefault();
  const scope = f.dataset.scope, inp = f.querySelector('input'), v = inp.value.trim(); if (!v) return;
  if (scope === 'ex' || scope === 'shop' || scope.startsWith('food:')) {
    if (scope === 'ex') addExercise(v); else if (scope === 'shop') addShop(v); else addFood(scope.slice(5), v);
    haptic(); render();
    const again = document.getElementById(inp.id); if (again) again.focus();
    return;
  }
  const item = { id: uid(), t: v, done: false };
  let arr;
  if (scope === 'day') { ensure(viewDate); arr = dayRec(viewDate).items; }
  else { const l = S.lists.find(x => x.id === scope); if (!l) return; arr = l.items; }
  arr.push(item); save();
  const ul = $('#pend-' + scope);
  ul.insertAdjacentHTML('beforeend', itemRow(item)); ul.lastElementChild.classList.add('entering'); haptic();
  $('#empty-' + scope)?.remove();
  inp.value = ''; inp.focus();
  if (scope === 'day') updateRing();
});
// Enter salva nas folhas
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetCtx) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'f-title' && sheetCtx) {
    e.preventDefault();
    const map = { item: 'save-item', routine: 'save-routine', list: 'save-list', plan: 'save-plan', shop: 'shop-save' };
    actions[map[sheetCtx.kind]]?.();
  }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('pex-in')) planEx[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
  if (e.target.classList.contains('dm-in')) dietEdit[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
  if (e.target.id === 'f-voice') voicePreview();
  if (e.target.classList.contains('rt-in')) { if (e.target.value) rTimes[e.target.dataset.d] = e.target.value; else delete rTimes[e.target.dataset.d]; }
  if (e.target.id === 'f-time') { const a = $('#f-alert'); if (a) { a.disabled = !e.target.value; if (!e.target.value) a.value = ''; } }
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('sin') || e.target.classList.contains('ex-name')) {
    const s = activeSession(); if (!s) return;
    const ex = s.ex[+e.target.dataset.ei]; if (!ex) return;
    if (e.target.classList.contains('ex-name')) { if (e.target.value.trim()) ex.n = e.target.value.trim(); }
    else ex.sets[+e.target.dataset.si][e.target.dataset.f] = e.target.value.replace(',', '.').trim();
    save(); return;
  }
  if (e.target.id === 'f-alert' && e.target.value !== '' && 'Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (err) {}
  }
  if (!e.target.classList.contains('vday')) return;
  const v = voiceTasks[+e.target.dataset.i]; if (v) dayOv[v.t] = e.target.value;
});
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => importText(rd.result); rd.readAsText(f); e.target.value = '';
});
$('#keep-file').addEventListener('change', e => {
  const fs = [...e.target.files]; e.target.value = '';
  if (fs.length) importKeep(fs).catch(() => toast('Não consegui ler esse arquivo. Use o .zip do Google Takeout.'));
});
// deslizar para mudar de dia
// Deslizar uma tarefa: para a direita conclui (ou reabre), para a esquerda passa para o próximo dia.
let sw = null, swallowClick = false;
document.addEventListener('pointerdown', e => {
  const li = e.target.closest('.item');
  if (!li || li.classList.contains('is-moved') || sheetCtx || e.button > 0) return;
  sw = { li, x: e.clientX, y: e.clientY, dx: 0, mode: null, id: li.dataset.id, pid: e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.mode) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.4) startSwipe();
    else { if (Math.abs(dy) > 8) sw = null; return; }
  }
  const w = sw.li.offsetWidth;
  sw.dx = Math.max(sw.canLeft ? -w : 0, Math.min(w, dx));
  const th = Math.min(110, w * .33), armedNow = Math.abs(sw.dx) >= th;
  if (armedNow !== sw.armed) { sw.armed = armedNow; if (armedNow) haptic(); }
  sw.li.style.setProperty('--dx', sw.dx + 'px');
  sw.li.classList.toggle('sw-r', sw.dx > 0); sw.li.classList.toggle('sw-l', sw.dx < 0); sw.li.classList.toggle('armed', armedNow);
});
function startSwipe() {
  const loc = locate(sw.id); if (!loc) { sw = null; return; }
  sw.mode = 'h'; sw.done = loc.i.done;
  sw.canLeft = !!loc.k && !loc.i.done;
  sw.target = loc.k ? laterTarget(loc.k) : null;
  sw.li.classList.add('swiping');
  sw.li.insertAdjacentHTML('afterbegin', `<div class="swipe-bg" aria-hidden="true"><span class="sb sb-r">${I.check}${sw.done ? 'Reabrir' : 'Concluir'}</span><span class="sb sb-l">${sw.target === today() ? 'Hoje' : 'Amanhã'}${I.right}</span></div>`);
  try { sw.li.setPointerCapture(sw.pid); } catch (e) {}
}
function endSwipe(cancel) {
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.mode) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 400);
  const li = s.li, w = li.offsetWidth;
  li.classList.add('settle');
  if (!cancel && s.armed) {
    li.style.setProperty('--dx', (s.dx > 0 ? w : -w) + 'px');
    setTimeout(() => (s.dx > 0 ? swipeDone(s, li) : swipeLater(s)), 200);
  } else {
    li.style.setProperty('--dx', '0px');
    setTimeout(() => { li.classList.remove('swiping', 'settle', 'sw-r', 'sw-l', 'armed'); li.querySelector('.swipe-bg')?.remove(); }, 230);
  }
}
function swipeDone(s, li) {
  const i = findItem(s.id); if (!i) return render();
  snap(); i.done = !i.done; i.at = i.done ? Date.now() : undefined; save(); haptic();
  li.style.height = li.offsetHeight + 'px'; void li.offsetHeight;
  li.classList.add('leaving'); li.style.height = '0px';
  setTimeout(() => { render(); toast(i.done ? 'Concluída' : 'Reaberta', true); }, 240);
}
function swipeLater(s) {
  snap();
  if (!moveItem(s.id, s.target)) return render();
  haptic(); render(); toast(s.target === today() ? 'Trazida para hoje' : 'Passada para amanhã', true);
}
document.addEventListener('pointerup', e => { if (sw && e.pointerId === sw.pid) endSwipe(false); });
document.addEventListener('pointercancel', e => { if (sw && e.pointerId === sw.pid) endSwipe(true); });
document.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

// deslizar fora das tarefas muda de dia
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { if (e.target.closest('#swipe, .dayhead') && !e.target.closest('.item')) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } else tx = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null || tab !== 'hoje' || sheetCtx) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) { viewDate = addDays(viewDate, dx < 0 ? 1 : -1); render(true); }
}, { passive: true });
// virada do dia com o app aberto
function tick() {
  const t = today();
  if (t !== lastToday) {
    const wasToday = viewDate === lastToday; lastToday = t;
    const n = rollover(); ensure(t); save();
    if (wasToday) viewDate = t;
    if (!sheetCtx) render();
    if (n) toast(`${n} pendência${n === 1 ? '' : 's'} trazida${n === 1 ? '' : 's'} para hoje`);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); scheduleSync(300); } });
window.addEventListener('online', () => scheduleSync(300));
setInterval(() => { if (!document.hidden) sync(); }, 60000);
setInterval(tick, 60000);

// ---------- início ----------
S = load(); S = S ? normalize(S) : seed();
const carried = rollover(); ensure(today()); write(); save();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
applyLayout(); renderTabs(); render(); scheduleLocal();
scheduleSync(400);
if (!S.ui.swipeHint) { S.ui.swipeHint = 1; write(); setTimeout(() => toast('Dica: deslize uma tarefa para a direita para concluir, ou para a esquerda para passar para amanhã.'), 900); }
if (carried) toast(`${carried} pendência${carried === 1 ? '' : 's'} trazida${carried === 1 ? '' : 's'} para hoje`);
})();
</script>

<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
